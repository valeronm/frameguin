[package]
name = "frameguin"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Hardware controls for Framework laptops"
homepage = "https://github.com/valeronm/frameguin"
repository = "https://github.com/valeronm/frameguin"

[lints]
workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
async-channel = "2.5.0"
frameguin-model = { workspace = true }
frameguin-wire = { workspace = true }
# v4_6 for the label's natural-wrap mode; libadwaita 1.4 already needs GTK
# 4.12, so no platform this runs on lacks it.
gtk4 = { version = "0.11.4", features = ["v4_6"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
serde = { workspace = true }
zbus = { workspace = true }

# One package ships both binaries, so the daemon is listed as an asset rather
# than packaged from its own crate. target/release/data is a staging tree
# generated by packaging/build-deb.sh, not a source directory: target/release
# is the prefix cargo-deb resolves against the real target dir, which a path
# under packaging/ would not be.
[package.metadata.deb]
maintainer = "Valerii Myronov <valeriy@hey.com>"
copyright = "2026 Valerii Myronov"
license-file = ["../LICENSE", "0"]
extended-description = """\
Settings are changed from a GTK4/libadwaita window, or from a tray menu that \
needs no window open. A root D-Bus daemon holds the hardware access; the GUI \
is unprivileged and setters are authorized through polkit."""
section = "utils"
# No policykit-1 fallback: the app needs libadwaita 1.4, so the oldest
# release it can run on already ships polkitd.
# libgcc-s1 is Priority: required but not Essential, so it has to be declared;
# cargo-deb's shared-library scan misses it.
depends = "$auto, polkitd, libgcc-s1"
# The tray icon needs a host-side AppIndicator implementation; stock GNOME
# has none, KDE and Xfce do. Not a hard dependency — the window works alone.
recommends = "gnome-shell-extension-appindicator"
maintainer-scripts = "../packaging/deb/"
changelog = "../packaging/changelog"
assets = [
    ["target/release/frameguin", "usr/bin/", "755"],
    ["target/release/frameguin-daemon", "usr/libexec/", "755"],
    # /usr/share, not /etc: /etc/dbus-1/system.d is the sysadmin's override
    # slot, which install.sh uses because a /usr/local install has no other.
    ["target/release/data/io.github.valeronm.Frameguin.conf", "usr/share/dbus-1/system.d/", "644"],
    ["target/release/data/io.github.valeronm.Frameguin.service", "usr/share/dbus-1/system-services/", "644"],
    # The systemd unit is absent by design — the systemd-units stanza below
    # installs it, and listing it here too would declare it twice.
    ["target/release/data/io.github.valeronm.Frameguin.policy", "usr/share/polkit-1/actions/", "644"],
    ["target/release/data/io.github.valeronm.Frameguin.desktop", "usr/share/applications/", "644"],
    ["target/release/data/io.github.valeronm.Frameguin.metainfo.xml", "usr/share/metainfo/", "644"],
    ["target/release/data/icons/io.github.valeronm.Frameguin.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["target/release/data/icons/io.github.valeronm.Frameguin-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
    ["../README.md", "usr/share/doc/frameguin/README.md", "644"],
    ["target/release/data/frameguin.1.gz", "usr/share/man/man1/frameguin.1.gz", "644"],
]

# Installs the unit and generates the systemd maintainer-script snippets, so a
# chroot or container install behaves like every other package. Not enabled or
# started: D-Bus activation runs the daemon, and the unit has no [Install].
# systemd is the only refresh needing this — the icon theme, desktop database
# and bus config all have dpkg triggers owned by packages depended on above.
# unit-scripts is manifest-relative and gets none of the target-dir remapping
# the assets list relies on, hence the leading `../`.
[package.metadata.deb.systemd-units]
unit-scripts = "../target/release/data"
unit-name = "frameguin-daemon"
enable = false
start = false
