[package]
name = "frameguin"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Hardware settings and readings for Framework laptops"
homepage = "https://github.com/valeronm/frameguin"
repository = "https://github.com/valeronm/frameguin"

[lints]
workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
async-lock = "3.4.2"
frameguin-contract = { workspace = true }
frameguin-model = { workspace = true }
frameguin-wire = { workspace = true }
# v4_6 for the label's natural-wrap mode; libadwaita 1.5 already needs a
# newer GTK, so no platform this runs on lacks it.
gtk4 = { version = "0.11.4", features = ["v4_6"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
serde = { workspace = true }
zbus = { workspace = true }
