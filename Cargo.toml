[workspace]
members = ["daemon", "app", "wire", "model", "hardware"]
resolver = "2"

[workspace.package]
version = "0.5.0"

[workspace.dependencies]
frameguin-hardware = { path = "hardware" }
frameguin-model = { path = "model" }
frameguin-wire = { path = "wire" }
serde = { version = "1", features = ["derive"] }
# `option-as-array` carries an `Option` over D-Bus, which has no maybe type,
# as an array of zero or one element.
zbus = { version = "5.19.0", features = ["option-as-array"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
strip = true
