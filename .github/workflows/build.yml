name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Pinned, not ubuntu-latest: the binaries need the glibc they were built
    # against or newer, and this is the oldest release carrying the
    # libadwaita 1.5 the app needs.
    runs-on: ubuntu-24.04
    # A hung test would otherwise hold the job for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # The same list README gives for building by hand; both have to
          # change together.
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libudev-dev
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils shellcheck

      - name: Install the toolchain pinned in mise.toml
        # so CI builds with the versions a developer builds with
        run: |
          rust_version=$(sed -n 's/^rust = "\(.*\)"$/\1/p' mise.toml)
          rustup toolchain install "$rust_version" --profile minimal --component clippy,rustfmt
          rustup default "$rust_version"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Static checks
        # install.sh runs as root and get.sh is fetched straight into a shell,
        # so they get the same scrutiny as the code.
        run: |
          # First because it compiles nothing: a formatting slip fails here in
          # seconds rather than after clippy has built the workspace.
          cargo fmt --all --check
          shellcheck install.sh packaging/*.sh
          desktop-file-validate data/*.desktop
          cargo clippy --workspace --release -- -D warnings
          # Release so the dependency artifacts carry over to the tarball
          # built below, which is the only sharing on offer: clippy's build
          # above is fingerprinted under its own wrapper and reuses nothing.
          # The daemon's tests want zbus with its p2p feature, so zbus and
          # what sits above it are built once more for the test targets.
          cargo test --workspace --release

      - name: Build the tarball
        run: ./packaging/build-tarball.sh

      # Tags only: the release job below is the one reader.
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: tarball
          path: |
            target/dist/*.tar.xz
            target/dist/*.sha256

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: dist

      - name: Create a draft release or refresh its assets
        # The notes are written by hand on the draft.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(find dist -type f)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $assets --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" $assets \
              --repo "$GITHUB_REPOSITORY" \
              --title "frameguin $GITHUB_REF_NAME" \
              --draft
          fi
