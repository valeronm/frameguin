[package]
name = "frameguin-hardware"
version.workspace = true
edition = "2024"
license = "MIT"

[lints]
workspace = true

[features]
# The role and store stubs this crate's own tests run the devices against,
# for another crate's tests to build the same devices from. Asked for only by
# a dev-dependency, which the workspace's resolver keeps out of the binaries.
testing = []

# The one crate that links the hardware libraries. A process that links it
# has hardware access, which is why the app does not and the daemon does.
[dependencies]
# Already in the tree via zbus; named for the power LED's one timer.
async-io = "2"
frameguin-wire = { workspace = true }
framework_lib = { version = "0.6.5", default-features = false, features = ["hidapi"] }
hidapi = "2"
# Already in the tree via framework_lib; named for the GPIO character
# device's ioctls, which no safe wrapper here would be smaller than.
libc = "0.2"
