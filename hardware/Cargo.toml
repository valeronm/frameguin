[package]
name = "frameguin-hardware"
version.workspace = true
edition = "2024"
license = "MIT"

[lints]
workspace = true

[features]
# The role and store stubs this crate's own tests run the devices against,
# for another crate to build the same devices from. Asked for only by
# a dev-dependency or behind a feature that is off by default, either of
# which keeps it out of the binaries the tarball builds.
testing = []

# The one crate that links the hardware libraries. A process that links it
# has hardware access, which is why the app does not and the daemon does.
[dependencies]
# Named for the power LED's one timer.
async-io = "2"
frameguin-contract = { workspace = true }
framework_lib = { version = "0.6.6", default-features = false, features = ["hidapi"] }
hidapi = "2"
# Already in the tree via framework_lib; named for the GPIO character
# device's ioctls, which no safe wrapper here would be smaller than.
libc = "0.2"
